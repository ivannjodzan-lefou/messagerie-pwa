<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- SDKs Firebase (Compat Version CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- En-tête de l'application -->
    <header class="chat-header">
        <div>
            <h2>Ma Messagerie</h2>
            <span id="status-indicator" class="status offline">Hors ligne</span>
        </div>
        <button id="clear-btn" title="Vider la discussion">🗑️</button>
    </header>

    <!-- Zone d'affichage des messages -->
    <main id="chat-box" class="chat-box">
        <div class="message system">Bienvenue ! Les messages sont synchronisés en temps réel.</div>
    </main>

    <!-- Formulaire d'envoi -->
    <footer class="chat-input-area">
        <input type="text" id="message-input" placeholder="Écrivez un message..." autocomplete="off">
        <button id="send-btn">Envoyer</button>
    </footer>

    <script src="app.js"></script>
</body>
</html>
